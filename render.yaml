# Render Blueprint: game server (free web service, sleeps when idle) + client (static site, never sleeps).
# autoDeploy is off on purpose: every deploy restarts the server and wipes in-progress matches.
services:
  - type: web
    name: idko-server
    runtime: node
    plan: free
    region: oregon # pick the region closest to your friends
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: false
    envVars:
      - key: NODE_ENV
        value: production
      - key: CLIENT_ORIGIN
        sync: false # e.g. https://idko-client.onrender.com

  - type: web
    name: idko-client
    runtime: static
    buildCommand: node scripts/build-static.js
    staticPublishPath: dist
    autoDeploy: false
    envVars:
      - key: GAME_SERVER_URL
        sync: false # e.g. https://idko-server.onrender.com
